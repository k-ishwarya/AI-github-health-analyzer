[project]
name = "ai-github-health-analyzer-backend"
version = "0.1.0"
description = "Backend for AI GitHub Repository Health Analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "google-genai>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
