[project]
name = "ai-github-health-analyzer-backend"
version = "0.1.0"
description = "Backend for AI GitHub Repository Health Analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.35",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "supabase>=2.5.2",
    "weasyprint>=62.5",
    "jinja2>=3.1.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
